events {}

http {
	upstream frontend {
		server app-nodejs:3000;
	}
	upstream backend {
		# server app1:8080;
		# server app2:8080;
		# keepalive 64;
		server app-java:8080;
	}

	server {
		listen 80;
		
		location / {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_connect_timeout 1s;
			proxy_read_timeout 3s;
			proxy_pass http://backend;
		}
	}
}