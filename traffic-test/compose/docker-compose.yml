version: "3.8"

services:
  nginx:
    image: nginx:1.25
    ports:
      - "${LAB_HTTP_PORT}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks: [lab]

  app1:
    build: ../app
    environment:
      - APP_INSTANCE=app1
      - REDIS_HOST=redis
    networks: [lab]

  app2:
    build: ../app
    environment:
      - APP_INSTANCE=app2
      - REDIS_HOST=redis
    networks: [lab]

  # redis:
  #   image: redis:7
  #   ports:
  #     - "${REDIS_PORT}:6379"
  #   networks: [lab]

  postgres:
    image: postgres:15
    container_name: traffic-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: traffic_db
    ports:
      - "15432:5432"
    volumes:
      - ../db-data:/var/lib/postgresql/data

networks:
  lab:
    driver: bridge